<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Windows 7 style system tray expander arrow (expanded / "close popup") -->
<svg
   width="256mm"
   height="256mm"
   viewBox="0 0 256 256"
   version="1.1"
   id="arrow-down-symbolic"
   xmlns="http://www.w3.org/2000/svg">
  <defs
     id="defs1">
    <linearGradient
       id="win7ArrowBody"
       x1="128"
       y1="78"
       x2="128"
       y2="178"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         style="stop-color:#6e6e6e;stop-opacity:1;"
         id="stop1" />
      <stop
         offset="1"
         style="stop-color:#454545;stop-opacity:1;"
         id="stop2" />
