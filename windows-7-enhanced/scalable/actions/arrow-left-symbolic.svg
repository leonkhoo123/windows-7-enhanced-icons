   height="256mm"
   viewBox="0 0 256 256"
   version="1.1"
   id="arrow-left-symbolic"
   xmlns="http://www.w3.org/2000/svg">
  <defs
     id="defs1">
    <linearGradient
       id="win7ArrowBody"
       x1="128"
       y1="36"
       x2="128"
       y2="220"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         style="stop-color:#6e6e6e;stop-opacity:1;"
         id="stop1" />
      <stop
         offset="1"
         style="stop-color:#454545;stop-opacity:1;"
