<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- process-working / busywidget - rotation-friendly Windows 7 wait ring.
     KDE/Kirigami busy indicators only ROTATE a static icon, so the ring body is
     a single concentric radial gradient (rotationally symmetric) and only the
     white highlight is asymmetric, so spinning reads like the real Aero cursor
     (the highlight orbits, the body stays put). The highlight is a clean,
     flat-ended solid white arc (no rounding, no soft edges). -->
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="256"
   height="256"
   viewBox="0 0 256 256"
   version="1.1"
   id="process-working">
  <defs>
    <radialGradient id="ringBody" gradientUnits="userSpaceOnUse" cx="128.0" cy="128.0" r="86.0">
      <stop offset="0.628" stop-color="#3c82bd"/>
      <stop offset="0.665" stop-color="#58a9df"/>
      <stop offset="0.72"  stop-color="#76cdf4"/>
      <stop offset="0.80"  stop-color="#6dc4f1"/>
      <stop offset="0.90"  stop-color="#4c9ad4"/>
      <stop offset="0.97"  stop-color="#3a82c2"/>
      <stop offset="1.0"   stop-color="#2f6fae"/>
    </radialGradient>
  </defs>

  <path d="M214.000,128.000 A86.0,86.0 0 1 1 42.000,128.000 A86.0,86.0 0 1 1 214.000,128.000 Z M182.000,128.000 A54.0,54.0 0 1 0 74.000,128.000 A54.0,54.0 0 1 0 182.000,128.000 Z" fill="url(#ringBody)" fill-rule="evenodd"/>
  <path d="M51.373,167.043 A86.0,86.0 0 0 1 51.373,88.957 L79.886,103.485 A54.0,54.0 0 0 0 79.886,152.515 Z" fill="#ffffff"/>
</svg>
